name: Claude Code Review

# Triggered ONLY when the PR Review Loop (or a human) comments "@claude review"
# on a pull request. No automatic run on every push, so no wasted tokens.
# Copy to <repo>/.github/workflows/claude-review.yml

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review ONLY the changes in this pull request (`gh pr diff`). The PR branch is checked out.
            Report only real problems: bugs, security issues, data loss, broken tests, missing error
            handling that matters. Do NOT report style nits, naming preferences, or speculative refactors.
            Do not re-raise anything already discussed or resolved in existing PR threads.
            Report at most 8 findings.

            For each finding use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            on the exact line, stating severity (high/medium/low), the problem, and the fix.

            Finish with exactly ONE top-level `gh pr comment` summary:
            - If there are no blocking problems, start it with "LGTM - no issues found."
            - Otherwise start it with "Changes recommended:" followed by a one-line count.
            Do not modify any files or push commits.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

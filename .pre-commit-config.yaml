repos:
  # Ruff runs from the uv-locked dev dependency, so pre-commit, CI and a local
  # `uv run ruff` always use the same version (no separate rev to keep in sync).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package\.lock\.json|uv\.lock

  - repo: local
    hooks:
      - id: pytest
        name: run local tests
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
